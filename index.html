<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4cdb">
<meta name="robots" content="noindex">
<title>English Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇬🇧</text></svg>">
<style>
:root{
  --bg:#f4f2ff; --card:#ffffff; --ink:#1d1a33; --muted:#6b6785; --line:#e3e0f5;
  --pri:#5b4cdb; --pri2:#7c6ff0; --priSoft:#ebe8ff;
  --ok:#17a34a; --okSoft:#e3f8ea; --bad:#dc2f3c; --badSoft:#fde8ea;
  --gold:#f5a524; --goldSoft:#fff3d6; --fire:#ff6a2b;
  --shadow:0 4px 14px rgba(40,30,110,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111f; --card:#1f1c31; --ink:#f1efff; --muted:#a9a4c7; --line:#332f4d;
    --pri:#8c80ff; --pri2:#a79dff; --priSoft:#2b2650;
    --ok:#3ccf74; --okSoft:#163524; --bad:#ff6470; --badSoft:#3d1a20;
    --gold:#ffbf47; --goldSoft:#3a2e12; --shadow:0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#13111f; --card:#1f1c31; --ink:#f1efff; --muted:#a9a4c7; --line:#332f4d;
  --pri:#8c80ff; --pri2:#a79dff; --priSoft:#2b2650;
  --ok:#3ccf74; --okSoft:#163524; --bad:#ff6470; --badSoft:#3d1a20;
  --gold:#ffbf47; --goldSoft:#3a2e12; --shadow:0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;font-size:1.05rem;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sec{background:var(--priSoft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:none;border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn + .btn{margin-top:10px}

/* header */
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero .lvl{font-size:.9rem;opacity:.9}
.hero h1{color:#fff;margin:2px 0 10px}
.bar{height:12px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.18);padding:6px 10px;border-radius:99px;font-size:.88rem;font-weight:600}

/* topics */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative;border:2px solid transparent}
.topic.mastered{border-color:var(--gold);background:linear-gradient(180deg,var(--goldSoft),var(--card) 70%)}
.topic .em{font-size:1.9rem;line-height:1}
.topic .nm{font-weight:700;font-size:.98rem;line-height:1.2}
.topic .st{margin-top:auto;font-size:1.05rem;letter-spacing:2px}
.topic .badge{position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:800;background:var(--gold);color:#2b1d00;padding:3px 7px;border-radius:99px}
.star{color:var(--line)} .star.on{color:var(--gold)}
.section-t{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.section-t h2{margin:0}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:1.3rem;display:grid;place-items:center;flex:none}
.topbar .t{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* levels */
.level{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.level .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background:var(--priSoft);color:var(--pri);flex:none}
.level.done .n{background:var(--gold);color:#2b1d00}
.level.locked{opacity:.5}
.level .info{flex:1}
.level .info b{display:block}

/* theory */
.theory h3{margin-top:16px;color:var(--pri)}
.theory table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:.95rem}
.theory th,.theory td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.theory th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tip{background:var(--goldSoft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px;margin:10px 0}
.warn{background:var(--badSoft);border-left:4px solid var(--bad);padding:10px 12px;border-radius:10px;margin:10px 0}
.theory ul{padding-left:20px;margin:6px 0 10px}
.scroll-x{overflow-x:auto}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qbar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.streak{font-weight:800;color:var(--fire);min-width:52px;text-align:right}
.streak.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.4)}}
.qcard{background:var(--card);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.qtag{font-size:.78rem;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.qtext{font-size:1.2rem;font-weight:600}
.speak{margin-top:10px;background:var(--priSoft);color:var(--pri);padding:8px 14px;border-radius:99px;font-weight:700;font-size:.95rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:1.05rem;font-weight:600;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.ok{border-color:var(--ok);background:var(--okSoft);box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badSoft);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),visibility .3s}
.sheet.show{transform:none;visibility:visible}
.sheet .in{max-width:560px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:70vh;overflow:auto}
.sheet.ok .in{background:var(--okSoft)} .sheet.bad .in{background:var(--badSoft)}
.sheet h3{font-size:1.25rem}
.sheet.ok h3{color:var(--ok)} .sheet.bad h3{color:var(--bad)}
.sheet .why{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0 12px;font-size:.98rem}
.sheet .why b.lbl{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.xpfly{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-weight:900;font-size:1.6rem;color:var(--gold);pointer-events:none;z-index:40;animation:fly 1s forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes fly{to{transform:translate(-50%,-80px);opacity:0}}

/* results / modal */
.big{font-size:3.4rem;text-align:center;line-height:1}
.center{text-align:center}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--priSoft);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--pri)}
.stat span{font-size:.78rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--card);border-radius:24px;padding:24px 20px;max-width:400px;width:100%;text-align:center;animation:zoom .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.modal .box .big{font-size:4.5rem;margin-bottom:8px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.bdg .e{font-size:2rem}
.bdg b{display:block;font-size:.85rem;margin-top:4px}
.bdg span{font-size:.72rem;color:var(--muted);display:block}
.bdg.off{opacity:.38;filter:grayscale(1)}

textarea,input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;text-align:left}
.list-btn .e{font-size:1.6rem;flex:none}
.list-btn .info{flex:1}
.list-btn .info b{display:block}
.pill{background:var(--bad);color:#fff;font-weight:800;font-size:.8rem;padding:3px 9px;border-radius:99px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
"use strict";
/* =========================================================
   CONTENIDO (basado en los apuntes de Aaron, 1º ESO, unidad Welcome)
   Formato pregunta: [enunciado, [CORRECTA, incorrecta1, incorrecta2...], explicación, {notasPorOpciónIncorrecta}, textoParaEscuchar]
   La primera opción es siempre la correcta; se barajan al mostrarse.
   ========================================================= */

const an = w => /^[aeiou]/i.test(w) ? "an" : "a";

/* ---------- 1. Subject pronouns ---------- */
const PRON = [
 [ // Nivel 1
  ["¿Cómo se dice «yo» en inglés?",["I","me","my"],"«I» es el pronombre sujeto de «yo». Se escribe SIEMPRE con mayúscula, aunque vaya en mitad de la frase.",{"me":"«me» significa «me / a mí». Va después del verbo, no como sujeto.","my":"«my» significa «mi» (posesivo: my book)."}],
  ["¿Cómo se dice «él» en inglés?",["he","she","it"],"«he» = él (un chico, un hombre).",{"she":"«she» es «ella».","it":"«it» se usa para cosas y animales, no para personas."}],
  ["¿Cómo se dice «ella» en inglés?",["she","he","her"],"«she» = ella (una chica, una mujer).",{"he":"«he» es «él».","her":"«her» significa «su (de ella)» o «la / a ella». No puede ser sujeto."}],
  ["¿Cómo se dice «nosotros / nosotras»?",["we","they","us"],"«we» = nosotros/nosotras. Sirve igual para chicos y chicas.",{"they":"«they» es «ellos / ellas».","us":"«us» significa «nos / a nosotros» (objeto)."}],
  ["¿Cómo se dice «ellos / ellas»?",["they","them","we"],"«they» = ellos / ellas. En inglés no cambia si son chicos o chicas.",{"them":"«them» es «los / les / a ellos» (objeto).","we":"«we» es «nosotros»."}],
  ["¿Cómo se dice «vosotros / vosotras»?",["you","we","they"],"«you» sirve para «tú» y también para «vosotros». Es la misma palabra en singular y en plural.",{"we":"«we» es «nosotros».","they":"«they» es «ellos»."}],
  ["¿Cómo se dice «tú»?",["you","your","I"],"«you» = tú. (Y también vosotros.)",{"your":"«your» es «tu / vuestro» (posesivo: your pen).","I":"«I» es «yo»."}],
  ["¿Qué pronombre usas para UNA cosa o UN animal?",["it","he","they"],"«it» se usa para cosas y animales en singular: The table → it, the dog → it.",{"he":"«he» es solo para un chico u hombre.","they":"«they» es plural (varias cosas o personas)."}],
  ["Completa: ___ am 12 years old.",["I","Me","My"],"Delante del verbo va el pronombre SUJETO: I am… «Me» y «My» nunca pueden ser sujeto.",{"Me":"«Me» va después del verbo: Can you help me?","My":"«My» necesita un nombre detrás: my bike."}],
  ["¿Cuál de estas palabras es SIEMPRE con mayúscula?",["I","you","we"],"El pronombre «I» (yo) siempre va en mayúscula en inglés, esté donde esté: Yesterday I was happy.",{}]
 ],
 [ // Nivel 2
  ["Tom is a boy. → ___ is a boy.",["He","She","It"],"Tom es un chico → he.",{"She":"«She» es para chicas.","It":"«It» es para cosas y animales."}],
  ["My mother is a teacher. → ___ is a teacher.",["She","It","He"],"My mother (mi madre) es una mujer → she.",{"It":"«It» no se usa para personas.","He":"«He» es para hombres."}],
  ["The dog is small. → ___ is small.",["It","They","He"],"Un animal en singular → it.",{"They":"«They» es plural, y aquí solo hay un perro.","He":"Para animales, en clase usamos «it»."}],
  ["Peter and I are students. → ___ are students.",["We","They","You"],"Peter and I = otra persona + yo = nosotros → we.",{"They":"«They» sería si tú no estuvieras incluido.","You":"«You» es tú o vosotros, pero aquí te incluyes tú (I)."}],
  ["Lucy and Tom are happy. → ___ are happy.",["They","He","We"],"Lucy y Tom = dos personas que no son yo → they.",{"He":"«He» es solo un chico.","We":"«We» te incluiría a ti."}],
  ["The books are on the table. → ___ are on the table.",["They","It","We"],"«they» también se usa para cosas en plural: the books → they.",{"It":"«It» es una sola cosa; aquí hay varios libros.","We":"«We» es nosotros."}],
  ["My bike is red. → ___ is red.",["It","She","He"],"Una cosa → it.",{"She":"Las cosas no son «she» en inglés.","He":"Las cosas no son «he» en inglés."}],
  ["Anna and you are friends. → ___ are friends.",["You","They","We"],"Anna + tú = vosotros → you.",{"They":"«They» no incluye a la persona con la que hablas.","We":"«We» incluiría al que habla (yo)."}],
  ["Mr Smith is from the UK. → ___ is from the UK.",["He","She","It"],"Mr = señor → he.",{"She":"Mrs / Miss / Ms son para mujeres → she.","It":"«It» no se usa para personas."}],
  ["The computers are new. → ___ are new.",["They","It","Them"],"Varias cosas → they.",{"It":"«It» es una sola cosa.","Them":"«Them» es objeto (después del verbo), no sujeto."}]
 ],
 [ // Nivel 3
  ["¿Qué frase es correcta?",["He is tall.","Is tall.","Him is tall."],"En inglés el sujeto es OBLIGATORIO. En español decimos «Es alto», pero en inglés hay que decir «He is tall».",{"Is tall.":"Falta el sujeto. En inglés nunca se puede quitar.","Him is tall.":"«Him» es objeto (le / a él). Como sujeto va «He»."}],
  ["«Es un gato» (hablando de un gato) →",["It is a cat.","Is a cat.","He is a cat."],"Necesitamos sujeto, y para un animal usamos «it»: It is a cat.",{"Is a cat.":"Falta el sujeto: en inglés no se puede omitir.","He is a cat.":"Para un animal en general usamos «it»."}],
  ["«Ellas son simpáticas» →",["They are nice.","She are nice.","Them are nice."],"Ellas = they. Con they el verbo es «are».",{"She are nice.":"«She» es una sola chica y va con «is».","Them are nice.":"«Them» es objeto. El sujeto es «They»."}],
  ["«Vosotros sois mis amigos» →",["You are my friends.","They are my friends.","We are my friends."],"Vosotros = you (igual que tú).",{"They are my friends.":"«They» = ellos.","We are my friends.":"«We» = nosotros."}],
  ["¿Qué frase está bien escrita?",["I'm from Spain.","i'm from Spain.","Me from Spain."],"«I» siempre en mayúscula, y el sujeto «I» lleva verbo: I'm = I am.",{"i'm from Spain.":"La «i» de «I'm» debe ir en mayúscula.","Me from Spain.":"«Me» no es sujeto y además falta el verbo «am»."}],
  ["You and I → ?",["We","You","They"],"Tú + yo = nosotros → we.",{"You":"«You» no incluye al que habla.","They":"«They» no incluye ni a ti ni a mí."}],
  ["The weather is nice. ___ is sunny.",["It","He","They"],"«It» también se usa para hablar del tiempo y de la hora: It is sunny. It's 5 o'clock.",{"He":"El tiempo no es una persona.","They":"Es singular."}],
  ["Completa: My friends and ___ are in the same class.",["I","me","my"],"En la posición de sujeto (antes del verbo) va «I»: My friends and I are…",{"me":"«me» es objeto. En el sujeto va «I».","my":"«my» necesita un nombre detrás (my friends)."}],
  ["María and Luis are from Peru. ___ are Peruvian.",["They","We","He"],"María y Luis = ellos → they.",{"We":"«We» te incluiría.","He":"«He» es un solo chico."}],
  ["Hello! ___ am Aaron. Nice to meet you!",["I","Me","He"],"Para presentarte: I am (I'm) + tu nombre.",{"Me":"«Me» no puede ser sujeto.","He":"«He» es otra persona."}]
 ]
];

/* ---------- 2. Countries and nationalities ---------- */
// [country(en), país(es), nationality, [errores típicos]]
const NAT = [
 ["the UK","Reino Unido","British",["Britain","Englandish"]],
 ["Canada","Canadá","Canadian",["Canadese","Canadish"]],
 ["the USA","Estados Unidos","American",["Americese","USAian"]],
 ["Australia","Australia","Australian",["Australish","Australese"]],
 ["Spain","España","Spanish",["Spainish","Spanese"]],
 ["Italy","Italia","Italian",["Italish","Italese"]],
 ["Germany","Alemania","German",["Germanian","Germanish"]],
 ["France","Francia","French",["Francese","Franch"]],
 ["Romania","Rumanía","Romanian",["Romanish","Romanese"]],
 ["Ireland","Irlanda","Irish",["Irelandish","Irelandian"]],
 ["Ukraine","Ucrania","Ukrainian",["Ukrainish","Ukrainese"]],
 ["Japan","Japón","Japanese",["Japaneses","Japanian"]],
 ["China","China","Chinese",["Chinian","Chineses"]],
 ["India","India","Indian",["Indish","Indese"]],
 ["Morocco","Marruecos","Moroccan",["Moroccese","Morocish"]],
 ["Brazil","Brasil","Brazilian",["Brazilish","Brazilese"]],
 ["Egypt","Egipto","Egyptian",["Egyptish","Egyptese"]],
 ["Argentina","Argentina","Argentinian",["Argentinish","Argentinese"]],
 ["Peru","Perú","Peruvian",["Peruish","Perunese"]],
 ["Colombia","Colombia","Colombian",["Columbian","Colombish"]]
];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function natRule(n){
  if(n==="French") return "«French» es irregular: no sigue ninguna terminación. ¡Hay que aprenderlo de memoria!";
  if(n==="German") return "«German» termina en -an (Germany → German, sin «-y»).";
  if(/ese$/.test(n)) return "Termina en <b>-ese</b> (Japanese, Chinese). Ojo: NUNCA lleva «s» al final, aunque sean varias personas: They are Japanese.";
  if(/ish$/.test(n)) return "Termina en <b>-ish</b> (British, Spanish, Irish).";
  return "Termina en <b>-an / -ian</b>, la terminación más común (Italian, Brazilian, Moroccan…).";
}
const NAT_L1 = NAT.map(([c,es,n,w]) => [`${cap(c)} <span class="muted">(${es})</span> → ¿nacionalidad?`, [n,...w], `${cap(c)} → <b>${n}</b>. ${natRule(n)} Las nacionalidades siempre van con MAYÚSCULA.`, {}]);
const NAT_L2 = NAT.map(([c,es,n],i) => {
  const o = NAT[(i+7)%NAT.length][0];
  return [`I'm <b>${n}</b>. I'm from ___.`, [c, n, o], `${n} es la nacionalidad de ${c} (${es}). Después de «from» va el PAÍS, no la nacionalidad: I'm from ${c}. I'm ${n}.`, {[n]:"Después de «from» va el país, no la nacionalidad.",[o]:`${cap(o)} es otro país.`}];
}).concat([
  ["¿Qué nacionalidad termina en -ese?",["Chinese","Indian","Irish"],"-ese: Japanese, Chinese.",{"Indian":"Indian termina en -an.","Irish":"Irish termina en -ish."}],
  ["¿Qué nacionalidad termina en -ish?",["Spanish","Italian","Chinese"],"-ish: British, Spanish, Irish.",{"Italian":"Italian termina en -ian.","Chinese":"Chinese termina en -ese."}],
  ["¿Cuál es la nacionalidad irregular?",["French","German","Canadian"],"French no sigue ninguna regla (France → French).",{"German":"German termina en -an.","Canadian":"Canadian termina en -ian."}]
]);

TOPICS.forEach(t => t.q.forEach((lv,li) => lv.forEach((q,qi) => { QIDX[`${t.id}-${li}-${qi}`] = {t:t.id, l:li, q}; })));

/* =========================================================
   ESTADO (guardado en localStorage)
   ========================================================= */
const KEY = "englishQuest_v1";
const blank = () => ({name:"Aaron", xp:0, bestStreak:0, correct:0, answered:0, fixed:0, sessions:0,
  daily:{last:"",streak:0}, topics:{}, q:{}, mistakes:{}, badges:{}, theory:{}, boss:0});
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(blank(), JSON.parse(r)); }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const tp = id => (S.topics[id] = S.topics[id] || {stars:0, best:[0,0,0]});

/* Niveles de jugador */
const XP_LV = [0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200];
const TITLES = ["Starter","Rookie","Explorer","Learner","Speaker","Talker","Smart cookie","Pro","Expert","Champion","Master","Grand master","Legend","Super legend","English hero"];
function lvInfo(xp){
  let i = 0; while(i < XP_LV.length-1 && xp >= XP_LV[i+1]) i++;
  const cur = XP_LV[i], nxt = XP_LV[i+1] ?? (cur+2000);
  return {lv:i+1, title:TITLES[i], pct: Math.min(100, (xp-cur)/(nxt-cur)*100), toNext: nxt-xp};
}

/* Logros */
const BADGES = [
  ["first","👣","Primer paso","Termina tu primer test"],
  ["streak5","🔥","En racha","5 aciertos seguidos"],
  ["streak10","⚡","Imparable","10 aciertos seguidos"],
  ["perfect","💯","Perfecto","Un test sin fallos"],
  ["theory","📖","Estudioso","Lee la teoría de todos los temas"],
  ["master1","🥇","Primer dominio","Domina un tema"],
  ["master4","🏅","Medio camino","Domina 4 temas"],
  ["masterAll","👑","Maestro del inglés","Domina todos los temas"],
  ["boss","🐉","Jefe derrotado","Aprueba el examen final"],
  ["daily3","📅","3 días seguidos","Practica 3 días seguidos"],
  ["daily7","🗓️","Semana completa","Practica 7 días seguidos"],
  ["fixer","🛠️","Corrector","Corrige 10 errores en el repaso"],
  ["hundred","💪","Centenario","100 respuestas correctas"]
];
function award(id){
  if(S.badges[id]) return false;
  S.badges[id] = new Date().toISOString().slice(0,10);
  const b = BADGES.find(x=>x[0]===id);
  queueModal({big:b[1], title:"¡Nuevo logro!", text:`<b>${b[2]}</b><br><span class="muted">${b[3]}</span>`, confetti:true});
  return true;
}
const masteredCount = () => TOPICS.filter(t => tp(t.id).stars >= 3).length;

function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function touchDaily(){
  const t = todayStr(); if(S.daily.last === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.daily.streak = (S.daily.last === todayStr(y)) ? S.daily.streak+1 : 1;
  S.daily.last = t;
  if(S.daily.streak >= 3) award("daily3");
  if(S.daily.streak >= 7) award("daily7");
}

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const strip = h => h.replace(/<[^>]+>/g,"");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v => /^en(-|_)GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
window.say = say;
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function confetti(n=70){
  const cols = ["#f5a524","#5b4cdb","#17a34a","#ff6a2b","#e64980","#22b8cf"];
  for(let i=0;i<n;i++){
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random()*100+"vw"; d.style.background = cols[i%cols.length];
    d.style.animationDuration = (1.8+Math.random()*1.8)+"s"; d.style.animationDelay = (Math.random()*.4)+"s";
    d.style.borderRadius = Math.random()>.5 ? "50%" : "2px";
    document.body.appendChild(d); setTimeout(()=>d.remove(), 4200);
  }
}
const MQ = []; let modalOpen = false;
function queueModal(m){ MQ.push(m); if(!modalOpen) nextModal(); }
function nextModal(){
  const m = MQ.shift(); if(!m){ modalOpen = false; return; }
  modalOpen = true;
  const el = document.createElement("div"); el.className = "modal";
  el.innerHTML = `<div class="box"><div class="big">${m.big}</div><h2>${m.title}</h2><p>${m.text}</p><button class="btn" id="mOk">${m.btn||"¡Genial!"}</button></div>`;
  document.body.appendChild(el);
  if(m.confetti) confetti();
  vibrate([30,40,30]);
  el.querySelector("#mOk").onclick = () => { el.remove(); nextModal(); };
}
function stars(n){ return [0,1,2].map(i=>`<span class="star ${i<n?"on":""}">★</span>`).join(""); }

/* ---------- Quiz ---------- */
let Z = null; // sesión actual
function mkQ(id){
  const {t,l,q} = QIDX[id];
  const [text, opts, expl, notes, sayTxt] = q;
  const order = shuffle(opts.map((o,i)=>i));
  return {id, t, l, text, opts: order.map(i=>opts[i]), correct: order.indexOf(0), right: opts[0], expl, notes: notes||{}, say: sayTxt};
}
function pickIds(ids, n){
  // prioriza preguntas nunca acertadas, luego las menos acertadas
  const scored = shuffle(ids).map(id => ({id, s: (S.q[id]?.[0]||0) - (S.q[id]?.[1]||0)*0.5}));
  scored.sort((a,b)=>a.s-b.s);
  return shuffle(scored.slice(0,n).map(x=>x.id));
}
window.startQuiz = function(tid, l){
  const ids = Object.keys(QIDX).filter(k => k.startsWith(tid+"-"+l+"-"));
  begin({mode:"topic", tid, l, title:`${TOPICS.find(x=>x.id===tid).name} · Nivel ${l+1}`, ids: pickIds(ids, QPER)});
};
window.startReview = function(){
  const ids = shuffle(Object.keys(S.mistakes).filter(k=>QIDX[k])).slice(0,10);
  if(!ids.length) return home();
  begin({mode:"review", title:"Repaso de errores", ids});
};
window.startBoss = function(){
  const ids = []; TOPICS.forEach(t => { const pool = Object.keys(QIDX).filter(k => k.startsWith(t.id+"-") && !k.startsWith(t.id+"-0-")); ids.push(...shuffle(pool).slice(0,2)); });
  begin({mode:"boss", title:"🐉 Examen final", ids: shuffle(ids).slice(0,15)});
};
function begin(cfg){
  touchDaily();
  Z = Object.assign(cfg, {qs: cfg.ids.map(mkQ), i:0, ok:0, streak:0, xp:0, answered:false, best:0});
  save(); renderQ();
}
function renderQ(){
  hideSheet();
  const q = Z.qs[Z.i];
  const tname = TOPICS.find(x=>x.id===q.t);
  app.innerHTML = `
  <div class="qhead">
    <button class="back" onclick="quitQuiz()" aria-label="Salir">✕</button>
    <div class="qbar"><i style="width:${Z.i/Z.qs.length*100}%"></i></div>
    <div class="streak" id="stk">${Z.streak>=2?"🔥"+Z.streak:""}</div>
  </div>
  <div class="small muted" style="margin:-6px 2px 10px">${Z.title} · ${Z.i+1}/${Z.qs.length} · +${Z.xp} XP</div>
  <div class="qcard">
    ${Z.mode!=="topic"?`<div class="qtag">${tname.em} ${tname.name} · ${LEVEL_NAMES[q.l]}</div>`:""}
    <div class="qtext">${q.text}</div>
    ${q.say?`<button class="speak" onclick="say(${esc(JSON.stringify(q.say))})">🔊 Escuchar</button>`:""}
  </div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  Z.answered = false;
  window.scrollTo(0,0);
}
function answer(i){
  if(Z.answered) return; Z.answered = true;
  const q = Z.qs[Z.i], good = i === q.correct;
  const btns = app.querySelectorAll(".opt");
  btns.forEach((b,k) => { if(k===q.correct) b.classList.add("ok"); else if(k===i) b.classList.add("bad"); else b.classList.add("dim"); });
  const rec = S.q[q.id] || [0,0];
  S.answered++;
  let gain = 0;
  if(good){
    rec[0]++; Z.ok++; Z.streak++; S.correct++;
    Z.best = Math.max(Z.best, Z.streak);
    gain = 10 + Math.min(Z.streak-1, 5)*2;
    if(S.mistakes[q.id]){ delete S.mistakes[q.id]; S.fixed++; if(S.fixed>=10) award("fixer"); }
    if(Z.streak > S.bestStreak) S.bestStreak = Z.streak;
    if(Z.streak === 5) award("streak5");
    if(Z.streak === 10) award("streak10");
    if(S.correct >= 100) award("hundred");
    vibrate(20);
    const f = document.createElement("div"); f.className="xpfly"; f.textContent = `+${gain} XP`; document.body.appendChild(f); setTimeout(()=>f.remove(),1000);
    const st = $("#stk"); if(st){ st.textContent = Z.streak>=2 ? "🔥"+Z.streak : ""; st.classList.add("pop"); }
  } else {
    rec[1]++; Z.streak = 0; S.mistakes[q.id] = 1;
    vibrate([60,40,60]);
    const st = $("#stk"); if(st) st.textContent = "";
  }
  S.q[q.id] = rec; Z.xp += gain; S.xp += gain; save();
  const chosen = q.opts[i];
  const note = !good && q.notes[chosen] ? `<div class="why"><b class="lbl">Por qué «${esc(strip(chosen))}» no</b>${q.notes[chosen]}</div>` : "";
  const cheers = ["¡Correcto!","¡Muy bien!","¡Genial!","¡Eso es!","¡Perfecto!","¡Crack!"];
  showSheet(good ? "ok" : "bad", `
    <h3>${good ? "✅ "+cheers[Math.floor(Math.random()*cheers.length)] + (Z.streak>=3?` 🔥 ${Z.streak} seguidas`:"") : "❌ ¡Casi! No pasa nada"}</h3>
    ${good ? "" : `<div><b>Respuesta correcta:</b> ${q.right}</div>`}
    ${note}
    <div class="why"><b class="lbl">📘 La regla</b>${q.expl}</div>
    <button class="btn" id="nextBtn">${Z.i+1 < Z.qs.length ? "Siguiente" : "Ver resultado"}</button>`);
  $("#nextBtn").onclick = next;
}
function next(){ Z.i++; if(Z.i < Z.qs.length) renderQ(); else results(); }
window.quitQuiz = () => { if(confirmQuit()) home(); };
function confirmQuit(){ return Z.i === 0 || window.confirm("¿Salir del test? Perderás el progreso de este test (los puntos ya ganados se quedan)."); }

function results(){
  hideSheet();
  const n = Z.qs.length, pct = Math.round(Z.ok/n*100);
  S.sessions++; award("first");
  let bonus = 0, msg = "", passed = false, earnedStar = false, mastered = false;
  if(pct === 100){ bonus += 20; award("perfect"); }
  if(Z.mode === "topic"){
    const p = tp(Z.tid);
    passed = pct >= PASS[Z.l]*100;
    p.best[Z.l] = Math.max(p.best[Z.l], pct);
    if(passed){
      bonus += 30;
      if(p.stars === Z.l){ p.stars = Z.l+1; earnedStar = true; bonus += 50; }
      if(earnedStar && p.stars === 3){ mastered = true; bonus += 100; }
    }
    msg = passed ? (earnedStar ? `¡Has ganado una estrella ★${Z.l<2?" y desbloqueado el nivel "+(Z.l+2):""}!` : "¡Nivel superado otra vez!") : `Necesitas ${Math.ceil(PASS[Z.l]*n)} aciertos para superar el nivel. Lee las explicaciones y vuelve a intentarlo: ¡cada intento te hace más fuerte! 💪`;
  } else if(Z.mode === "boss"){
    passed = pct >= 80; S.boss = Math.max(S.boss, pct);
    if(passed){ bonus += 150; award("boss"); }
    msg = passed ? "¡Has derrotado al dragón del inglés! 🐉" : "Necesitas un 80 %. Repasa los temas con menos estrellas y vuelve.";
  } else {
    const left = Object.keys(S.mistakes).length;
    msg = left ? `Te quedan ${left} errores por corregir.` : "¡Has corregido todos tus errores! 🎉";
    passed = true;
  }
  S.xp += bonus; save();
  const totalXp = Z.xp + bonus;
  const emoji = pct === 100 ? "🏆" : passed ? "🎉" : pct >= 50 ? "💪" : "📚";
  app.innerHTML = `
  <div class="card center">
    <div class="big">${emoji}</div>
    <h1 style="margin-top:8px">${pct===100?"¡PERFECTO!":passed?"¡Superado!":"¡Sigue así!"}</h1>
    <p class="muted">${Z.title}</p>
    <div class="stats3">
      <div class="stat"><b>${Z.ok}/${n}</b><span>aciertos</span></div>
      <div class="stat"><b>+${totalXp}</b><span>XP</span></div>
      <div class="stat"><b>🔥${Z.best}</b><span>mejor racha</span></div>
    </div>
    <p>${msg}</p>
    ${bonus?`<p class="small muted">Incluye +${bonus} XP de bonus${pct===100?" (¡perfecto!)":""}.</p>`:""}
  </div>
  ${Z.mode==="topic" && passed && Z.l<2 ? `<button class="btn" onclick="startQuiz('${Z.tid}',${Z.l+1})">Siguiente nivel →</button>`:""}
  ${Z.mode==="topic" && !passed ? `<button class="btn" onclick="theory('${Z.tid}')">📖 Repasar teoría</button>`:""}
  ${Z.mode==="topic" ? `<button class="btn sec" onclick="startQuiz('${Z.tid}',${Z.l})">Repetir nivel</button>`:""}
  ${Z.mode==="review" && Object.keys(S.mistakes).length ? `<button class="btn" onclick="startReview()">Seguir repasando</button>`:""}
  ${Z.mode==="boss" ? `<button class="btn" onclick="startBoss()">Otra vez</button>`:""}
  <button class="btn ghost" onclick="${Z.mode==="topic"?`topicScreen('${Z.tid}')`:"home()"}">Volver</button>`;
  window.scrollTo(0,0);
  if(pct===100 || passed) confetti(pct===100?90:40);
  if(mastered){
    const t = TOPICS.find(x=>x.id===Z.tid);
    queueModal({big:"👑", title:"¡TEMA DOMINADO!", text:`Dominas <b>${t.name}</b>. Has superado los 3 niveles: práctica y teoría. <br><b>+100 XP</b>`, confetti:true, btn:"¡Soy un crack!"});
    const mc = masteredCount();
    if(mc>=1) award("master1"); if(mc>=4) award("master4"); if(mc>=TOPICS.length) award("masterAll");
  }
  const before = lvInfo(S.xp - totalXp).lv, after = lvInfo(S.xp).lv;
  if(after > before) queueModal({big:"⬆️", title:`¡Nivel ${after}!`, text:`Ahora eres <b>${lvInfo(S.xp).title}</b>.`, confetti:true});
}

    <h3 style="margin-top:16px">Cargar progreso</h3>
    <textarea id="imp" placeholder="Pega aquí tu código"></textarea>
    <button class="btn sec" style="margin-top:10px" onclick="importCode()">Cargar</button>
  </div>
  <div class="card"><h3>Empezar de cero</h3><p class="small muted">Borra todos los puntos, estrellas y logros de este dispositivo.</p><button class="btn ghost" style="color:var(--bad)" onclick="resetAll()">Borrar progreso</button></div>`;
};
window.saveName = () => { S.name = ($("#nm").value.trim() || "Aaron").slice(0,20); save(); home(); };
function exportCode(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return ""; } }
window.copyCode = () => { const t = $("#exp"); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>queueModal({big:"📋",title:"Copiado",text:"Guárdalo en un lugar seguro (por ejemplo, mándatelo por WhatsApp)."})); }catch(e){ document.execCommand("copy"); } };
window.importCode = () => {
  try{ const o = JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim())))); if(typeof o.xp!=="number") throw 0; S = Object.assign(blank(), o); save(); queueModal({big:"✅",title:"¡Progreso cargado!",text:`Bienvenido de vuelta, ${esc(S.name)}.`}); home(); }
  catch(e){ queueModal({big:"⚠️",title:"Código no válido",text:"Revisa que lo has copiado entero."}); }
};
window.resetAll = () => { if(window.confirm("¿Seguro? Se borrará todo el progreso.")){ S = blank(); save(); home(); } };
window.home = home;

/* Arranque */
if("speechSynthesis" in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>{}; }catch(e){} }
home();
</script>
</body>
</html>
